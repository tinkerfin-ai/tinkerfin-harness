[project]
name = "tinkerfin-sandbox"
version = "0.1.0"
description = "Sandbox integration package for TinkerFin."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

dependencies = [
    "deepagents>=0.7.5,<=0.7.13",
    "httpx>=0.28.1,<1",
    "langchain>=1.3.14,<=1.4.0",
    "langchain-core>=1.5.3,<=1.6.3",
    "opensandbox==0.1.16",
    "pydantic>=2,<3",
    "tinkerfin-contracts==0.1.0",
    "typing-extensions>=4.12.2,<5",
]

[project.optional-dependencies]
sqlalchemy = [
    "sqlalchemy[asyncio]==2.0.52",
    "tinkerfin-sqlalchemy==0.1.0",
]

[project.urls]
Homepage = "https://github.com/tinkerfin-ai/tinkerfin-harness"
Repository = "https://github.com/tinkerfin-ai/tinkerfin-harness"
Issues = "https://github.com/tinkerfin-ai/tinkerfin-harness/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tinkerfin_sandbox = ["py.typed"]
"tinkerfin_sandbox.backends" = ["_rooted_helper.py.txt"]
