[project]
name = "tinkerfin-gateway"
version = "0.1.0"
description = "Run commands, durable output, and client notifications for TinkerFin hosts."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "tinkerfin[agui]==0.1.0",
    "tinkerfin-contracts==0.1.0",
    "tinkerfin-messaging[agui]==0.1.0",
    "tinkerfin-notifications==0.1.0",
    "pydantic>=2,<3",
    "ag-ui-protocol==0.1.19",
    "langgraph>=1.2.10,<=1.2.11",
]

[project.optional-dependencies]
starlette = ["starlette>=0.49,<2"]

[project.urls]
Homepage = "https://github.com/tinkerfin-ai/tinkerfin-harness"
Repository = "https://github.com/tinkerfin-ai/tinkerfin-harness"
Issues = "https://github.com/tinkerfin-ai/tinkerfin-harness/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tinkerfin_gateway = ["py.typed"]

[tool.uv.sources]
tinkerfin = { workspace = true }
tinkerfin-contracts = { workspace = true }
tinkerfin-messaging = { workspace = true }
tinkerfin-notifications = { workspace = true }
