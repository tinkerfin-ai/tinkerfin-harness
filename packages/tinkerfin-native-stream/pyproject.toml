[project]
name = "tinkerfin-native-stream"
version = "0.1.0"
description = "Validated Deep Agents native stream contracts for TinkerFin."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

dependencies = [
    "langchain-core>=1.5.3,<=1.6.3",
    "langgraph>=1.2.10,<=1.2.11",
    "pydantic>=2,<3",
    "pydantic-core>=2,<3",
    "tinkerfin-contracts==0.1.0",
]

[project.urls]
Homepage = "https://github.com/tinkerfin-ai/tinkerfin-harness"
Repository = "https://github.com/tinkerfin-ai/tinkerfin-harness"
Issues = "https://github.com/tinkerfin-ai/tinkerfin-harness/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tinkerfin_native_stream = ["py.typed"]

[tool.uv.sources]
tinkerfin-contracts = { workspace = true }
