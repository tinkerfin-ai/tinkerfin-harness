[project]
name = "tinkerfin-langgraph-store"
version = "0.1.0"
description = "Async persistent LangGraph memory with exact namespaces and structured search."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["langgraph-checkpoint==4.2.0"]

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy[asyncio]==2.0.52", "tinkerfin-sqlalchemy==0.1.0", "tinkerfin-contracts==0.1.0"]

[project.urls]
Homepage = "https://github.com/tinkerfin-ai/tinkerfin-harness"
Repository = "https://github.com/tinkerfin-ai/tinkerfin-harness"
Issues = "https://github.com/tinkerfin-ai/tinkerfin-harness/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tinkerfin_langgraph_store = ["py.typed"]
