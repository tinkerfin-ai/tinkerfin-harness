[project]
name = "tinkerfin-automation"
version = "0.1.0"
description = "Durable scheduling and bounded execution for TinkerFin tasks."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

dependencies = [
    "langchain>=1.3.14,<=1.4.0",
    "langchain-core>=1.5.3,<=1.6.3",
    "pydantic>=2.12,<3",
    "tinkerfin==0.1.0",
    "tinkerfin-contracts==0.1.0",
    "tinkerfin-native-stream==0.1.0",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
sqlalchemy = [
    "sqlalchemy[asyncio]==2.0.52",
    "tinkerfin-sqlalchemy==0.1.0",
]

[project.urls]
Homepage = "https://github.com/tinkerfin-ai/tinkerfin-harness"
Repository = "https://github.com/tinkerfin-ai/tinkerfin-harness"
Issues = "https://github.com/tinkerfin-ai/tinkerfin-harness/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tinkerfin_automation = ["py.typed"]

[tool.uv.sources]
tinkerfin-contracts = { workspace = true }
tinkerfin-native-stream = { workspace = true }
tinkerfin = { workspace = true }
tinkerfin-sqlalchemy = { workspace = true }
