[project]
name = "tinkerfin"
version = "0.1.0"
description = "Request-scoped Native, Plan, Observation, and optional AG-UI streaming."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

dependencies = [
    "anyio>=4,<5",
    "deepagents>=0.7.5,<=0.7.13",
    "langchain>=1.3.14,<=1.4.0",
    "langchain-core>=1.5.3,<=1.6.3",
    "langgraph>=1.2.10,<=1.2.11",
    "jsonschema>=4.25,<5",
    "pydantic>=2,<3",
    "tinkerfin-contracts==0.1.0",
    "tinkerfin-native-stream==0.1.0",
    "tzdata>=2025.2",
    "typing-extensions>=4.12.2,<5",
    "wcmatch>=11,<12",
]

[project.optional-dependencies]
tracing = ["tinkerfin-tracing==0.1.0"]
agui = [
    "ag-ui-protocol==0.1.19",
    "tinkerfin-agui-adapter==0.1.0",
]
redis = [
    "redis>=6,<9",
    "langgraph-checkpoint-redis==0.5.1",
    "redisvl==0.25.1",
]

[project.urls]
Homepage = "https://github.com/tinkerfin-ai/tinkerfin-harness"
Repository = "https://github.com/tinkerfin-ai/tinkerfin-harness"
Issues = "https://github.com/tinkerfin-ai/tinkerfin-harness/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tinkerfin = ["*.pyi", "py.typed"]

[tool.uv.sources]
tinkerfin-tracing = { workspace = true }
tinkerfin-agui-adapter = { workspace = true }
tinkerfin-contracts = { workspace = true }
tinkerfin-native-stream = { workspace = true }
