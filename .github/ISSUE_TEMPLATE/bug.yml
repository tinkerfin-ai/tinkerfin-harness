name: Bug report
description: Report a reproducible problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Report security vulnerabilities privately to huyuanshann@gmail.com. Remove credentials and personal data from examples and logs."
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Framework packages
        - Studio backend
        - Studio web
        - Deployment
        - Documentation
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Release or commit, operating system, Python or Node version, and deployment method.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal example where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove secrets and personal data.
