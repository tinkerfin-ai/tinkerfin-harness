name: Docker integrations

on:
  workflow_dispatch:
  schedule:
    - cron: "17 20 * * *"

permissions:
  contents: read

concurrency:
  group: docker-integrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker-integrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true
          python-version: "3.11.16"
      - name: Install locked workspace
        run: uv sync --locked --all-packages --no-default-groups --group test --group integration
      - name: Verify Docker daemon
        run: docker info
      - name: Test disposable Docker integrations
        run: >-
          uv run --no-sync pytest -m docker_integration
          --durations=20 -o faulthandler_timeout=60 -v
