name: Studio server image

on:
  pull_request:
    branches: [main]
    paths:
      - apps/studio-server/**
      - packages/**
      - scripts/build_wheels.py
      - scripts/ci_changes.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/studio-image.yml
  push:
    branches: [main]
    paths:
      - apps/studio-server/**
      - packages/**
      - scripts/build_wheels.py
      - scripts/ci_changes.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/studio-image.yml
  workflow_dispatch:
    inputs:
      target:
        description: Build candidate sources or verify production with published PyPI packages
        type: choice
        required: true
        default: candidate
        options: [candidate, production]

permissions:
  contents: read

concurrency:
  group: studio-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      server: ${{ steps.select.outputs.server }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: python scripts/ci_changes.py

  build:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - name: Read application version
        id: version
        run: |
          version=$(python3 -c 'import runpy; print(runpy.run_path("apps/studio-server/src/tinkerfin_studio/version.py")["__version__"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || exit 1
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/studio-server/Dockerfile
          target: ${{ inputs.target || 'candidate' }}
          push: false
          platforms: ${{ matrix.platform }}
          load: true
          tags: studio-server:test
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=studio-${{ inputs.target || 'candidate' }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=studio-${{ inputs.target || 'candidate' }}-${{ matrix.arch }}
      - name: Verify runtime and file secrets
        id: runtime
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.value }}
          CONTAINER_NAME: studio-image-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
        run: |
          secrets_directory=$(mktemp -d "$RUNNER_TEMP/studio-secrets.XXXXXX")
          echo "secrets_directory=$secrets_directory" >> "$GITHUB_OUTPUT"
          printf 'fixture-secret' > "$secrets_directory/test"
          chmod 644 "$secrets_directory/test"
          docker run --rm --name "$CONTAINER_NAME" --mount "type=bind,src=$secrets_directory/test,dst=/run/secrets/test,readonly" \
            --env EXPECTED_VERSION studio-server:test python -c '
          import os
          from pathlib import Path
          from tinkerfin_studio.__main__ import create_app
          from tinkerfin_studio.version import __version__
          assert os.getuid() == 10001
          assert __version__ == os.environ["EXPECTED_VERSION"]
          assert Path("/run/secrets/test").read_text() == "fixture-secret"
          assert create_app().title
          '
      - name: Clean up verification resources
        if: always()
        env:
          CONTAINER_NAME: studio-image-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          IMAGE_ID: ${{ steps.image.outputs.imageid }}
          SECRETS_DIRECTORY: ${{ steps.runtime.outputs.secrets_directory }}
        run: |
          remove_and_verify() {
            local kind=$1 resource=$2 error
            error=$(mktemp) || return 1
            if ! docker "$kind" rm --force "$resource" 2>"$error"; then
              if [[ $(cat "$error") != "Error response from daemon: No such $kind: $resource" ]]; then
                cat "$error" >&2
                rm -f "$error"
                return 1
              fi
            fi
            if docker "$kind" inspect "$resource" >/dev/null 2>"$error"; then
              printf 'Verification resource still exists: %s %s\n' "$kind" "$resource" >&2
              rm -f "$error"
              return 1
            fi
            if [[ $(cat "$error") != "Error response from daemon: No such $kind: $resource" ]]; then
              cat "$error" >&2
              rm -f "$error"
              return 1
            fi
            rm -f "$error"
          }
          status=0
          remove_and_verify container "$CONTAINER_NAME" || status=1
          if [[ -n "$IMAGE_ID" ]]; then
            remove_and_verify image "$IMAGE_ID" || status=1
          fi
          if [[ -n "$SECRETS_DIRECTORY" ]]; then
            rm -rf -- "$SECRETS_DIRECTORY" || status=1
          fi
          exit "$status"
