name: Packages quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_NO_SYNC: "true"
  LANGSMITH_TRACING: "false"

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-and-studio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true
          python-version: "3.11.16"
      - name: Install locked workspace
        run: uv sync --locked --all-packages --no-default-groups --group test --group lint --group integration
      - name: Check repository and Studio formatting
        run: uv run ruff format --check apps/studio/server scripts tests
      - name: Lint repository and Studio contracts
        run: uv run ruff check apps/studio/server scripts tests
      - name: Test latest-only and Studio behavior
        run: >-
          uv run pytest tests/test_latest_only_contracts.py
          tests/test_docker_services.py
          apps/studio/server --durations=10

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/studio/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: pnpm
          cache-dependency-path: apps/studio/web/pnpm-lock.yaml
      - name: Install locked web dependencies
        run: pnpm install --frozen-lockfile
      - name: Test web behavior
        run: pnpm test
      - name: Lint web source
        run: pnpm lint

  web-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: apps/studio/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: pnpm
          cache-dependency-path: apps/studio/web/pnpm-lock.yaml
      - name: Install locked web dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/studio/web/pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Test web proxy
        if: matrix.shard == 1
        run: pnpm test:proxy
      - name: Build web application
        run: pnpm build
      - name: Test browser behavior and accessibility
        run: pnpm exec playwright test --grep-invert @performance --shard=${{ matrix.shard }}/2
      - name: Test browser performance
        if: matrix.shard == 2
        run: pnpm exec playwright test --grep @performance --workers=1
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-browser-results-${{ matrix.shard }}
          path: /tmp/tinkerfin-studio-playwright/
          retention-days: 7

  static-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true
          python-version: "3.11.16"
      - name: Install locked workspace
        run: uv sync --locked --all-packages --no-default-groups --group test --group lint --group integration
      - name: Check formatting
        run: uv run ruff format --check packages
      - name: Lint packages
        run: uv run ruff check packages
      - name: Check public API docstrings
        run: >-
          uv run ruff check packages/*/src
          --select D100,D101,D102,D103,D104,D105,D106,D107
      - name: Check repository types
        run: uv run pyright
      - name: Check package source types strictly
        run: uv run pyright -p pyright-packages-strict.json

  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11.16", "3.12.14", "3.13.15", "3.14.7"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install locked workspace
        run: uv sync --locked --all-packages --no-default-groups --group test --group lint --group integration
      - name: Test package coverage
        if: startsWith(matrix.python-version, '3.11.')
        run: >-
          uv run pytest packages tests/test_package_logging_contract.py
          -n 4 --dist=loadfile
          --durations=20
          -o faulthandler_timeout=60
          --cov=tinkerfin
          --cov=tinkerfin_contracts
          --cov=tinkerfin_native_stream
          --cov=tinkerfin_tracing
          --cov=tinkerfin_langgraph_store
          --cov=tinkerfin_sqlalchemy
          --cov=tinkerfin_agui_adapter
          --cov=tinkerfin_messaging
          --cov=tinkerfin_sandbox
          --cov=tinkerfin_automation
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=80
      - name: Test packages on supported Python
        if: ${{ !startsWith(matrix.python-version, '3.11.') }}
        run: uv run pytest packages -n 4 --dist=loadfile --durations=20 -o faulthandler_timeout=60

  wheel-boundaries:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11.16", "3.12.14", "3.13.15", "3.14.7"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install packaging test runner
        run: uv sync --locked --all-packages --no-default-groups --group packaging
      - uses: actions/cache@v4
        id: dependency-wheels
        with:
          path: .cache/test-wheels
          key: test-wheels-${{ runner.os }}-${{ runner.arch }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
      - name: Prepare locked dependency wheels
        if: steps.dependency-wheels.outputs.cache-hit != 'true'
        run: |
          uv export --locked --all-packages --no-dev --group packaging --no-emit-workspace --no-header --output-file "$RUNNER_TEMP/test-requirements.txt"
          uv run python -m pip download --require-hashes --no-deps --only-binary=:all: -r "$RUNNER_TEMP/test-requirements.txt" --dest .cache/test-wheels
      - name: Verify isolated wheel boundaries
        run: >-
          uv run python -m pytest --noconftest tests/packaging
          -m packaging_e2e --durations=10
        env:
          UV_OFFLINE: "true"

  quality-gate:
    name: Quality gate
    if: always()
    needs: [repository-and-studio, web, web-browser, static-checks, packages, wheel-boundaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [[ "$result" == success ]] || exit 1
          done
