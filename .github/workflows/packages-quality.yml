name: Packages quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_NO_SYNC: "true"
  LANGSMITH_TRACING: "false"

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  script-checks:
    name: Script checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - name: Install script test runner
        run: python -m pip install pytest==9.1.1
      - name: Test script entry points and Git boundaries
        run: python -m pytest -c .github/pytest-scripts.ini tests/test_studio_checks.py

  repository-and-studio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true
          python-version: "3.14.7"
      - name: Install locked workspace
        run: uv sync --locked --all-packages --no-default-groups --group test --group lint
      - name: Check repository and Studio formatting
        run: ./scripts/verify-studio-server.sh

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/studio/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: pnpm
          cache-dependency-path: apps/studio/web/pnpm-lock.yaml
      - name: Install locked web dependencies
        run: pnpm install --frozen-lockfile
      - name: Test, lint, build and check web packaging without Chromium
        run: python "${{ github.workspace }}/scripts/studio_checks.py" web-no-browser

  web-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: apps/studio/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: pnpm
          cache-dependency-path: apps/studio/web/pnpm-lock.yaml
      - name: Install locked web dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/studio/web/pnpm-lock.yaml') }}
      - name: Use Ubuntu HTTPS mirrors
        run: |
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' |
            sudo tee /etc/apt/apt-mirrors.txt >/dev/null
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Test web HTTP and browser uploads
        if: matrix.shard == 1
        run: pnpm test:http
      - name: Check web and browser test types
        run: pnpm exec tsc -b
      - name: Test browser behavior and accessibility
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/3
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-browser-results-${{ matrix.shard }}
          path: /tmp/tinkerfin-studio-playwright/
          retention-days: 7

  static-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true
          python-version: "3.14.7"
      - name: Install locked workspace
        run: uv sync --locked --all-packages --no-default-groups --group test --group lint
      - name: Check formatting
        run: uv run ruff format --no-cache --check packages
      - name: Lint packages
        run: uv run ruff check --no-cache packages
      - name: Check public API docstrings
        run: >-
          uv run ruff check --no-cache packages/*/src
          --select D100,D101,D102,D103,D104,D105,D106,D107
      - name: Check package source types strictly
        run: uv run pyright -p pyright-packages-strict.json

  macos-companion:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true
          python-version: "3.11.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: apps/desktop/runtime/package-lock.json
      - name: Install locked workspace and browser tool
        run: |
          test "$(uname -m)" = arm64
          uv sync --locked --all-packages --no-default-groups --group test --group lint --group packaging
          npm ci --prefix apps/desktop/runtime --ignore-scripts --no-audit --no-fund
          uv run python apps/desktop/scripts/build_browser_cli.py --output "$RUNNER_TEMP/browser-runtime/agent-browser"
          curl --fail --location --output "$RUNNER_TEMP/python.tar.zst" https://github.com/astral-sh/python-build-standalone/releases/download/20251031/cpython-3.11.14%2B20251031-aarch64-apple-darwin-pgo%2Blto-full.tar.zst
          curl --fail --location --output "$RUNNER_TEMP/node.tar.gz" https://nodejs.org/dist/v22.23.3/node-v22.23.3-darwin-arm64.tar.gz
      - name: Check Companion sources
        run: |
          uv run ruff check --no-cache apps/desktop
          uv run ruff format --no-cache --check apps/desktop
          uv run pyright apps/desktop/src apps/desktop/tests apps/desktop/scripts
      - name: Build and verify movable application
        run: |
          uv run python apps/desktop/scripts/build_macos.py --python-archive "$RUNNER_TEMP/python.tar.zst" --node-archive "$RUNNER_TEMP/node.tar.gz" --browser-cli "$RUNNER_TEMP/browser-runtime/agent-browser" --output "$RUNNER_TEMP/TinkerFin.app"
      - name: Prepare compatible browser for native tests
        run: |
          uv run python - <<'PY'
          import asyncio
          import os
          from pathlib import Path

          from tinkerfin_companion.browser_install import BrowserProvider

          cache = Path(os.environ["RUNNER_TEMP"]) / "tinkerfin-browser-cache"
          browser = asyncio.run(BrowserProvider(cache).resolve())
          with Path(os.environ["GITHUB_ENV"]).open("a") as environment:
              environment.write(f"TINKERFIN_TEST_CHROME={browser}\n")
          PY
      - name: Test native runtime, durable tasks and bundled entry
        env:
          TINKERFIN_TEST_APP: ${{ runner.temp }}/TinkerFin.app
          TINKERFIN_TEST_SRT: ${{ runner.temp }}/TinkerFin.app/Contents/Resources/runtime/node_modules/.bin/srt
          TINKERFIN_TEST_NODE: ${{ runner.temp }}/TinkerFin.app/Contents/Resources/node/bin/node
          TINKERFIN_TEST_BROWSER_CLI: ${{ runner.temp }}/browser-runtime/agent-browser
        run: |
          test -x "$TINKERFIN_TEST_BROWSER_CLI"
          test -x "$TINKERFIN_TEST_CHROME"
          test -x "$TINKERFIN_TEST_SRT"
          test -x "$TINKERFIN_TEST_NODE"
          uv run pytest apps/desktop/tests packages/tinkerfin-sandbox/tests/native packages/tinkerfin-remote/tests

  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true
          python-version: "3.14.7"
      - name: Install locked workspace
        run: uv sync --locked --all-packages --no-default-groups --group test --group lint
      - name: Test packages and logging contracts
        run: >-
          uv run pytest packages tests/test_package_logging_contract.py
          -n 4 --dist=loadfile --durations=20 -o faulthandler_timeout=60

  wheel-boundaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true
          python-version: "3.14.7"
      - name: Install packaging test runner
        run: uv sync --locked --all-packages --no-default-groups --group packaging
      - uses: actions/cache@v4
        id: dependency-wheels
        with:
          path: .cache/test-wheels
          key: test-wheels-${{ runner.os }}-${{ runner.arch }}-3.14.7-${{ hashFiles('uv.lock') }}
      - name: Prepare locked dependency wheels
        if: steps.dependency-wheels.outputs.cache-hit != 'true'
        run: |
          uv export --locked --all-packages --no-dev --group packaging --no-emit-workspace --no-header --output-file "$RUNNER_TEMP/test-requirements.txt"
          uv run python -m pip download --require-hashes --no-deps --only-binary=:all: -r "$RUNNER_TEMP/test-requirements.txt" --dest .cache/test-wheels
      - name: Verify isolated wheel boundaries
        run: >-
          uv run python -m pytest --noconftest tests/packaging
          -m packaging_e2e --durations=10
        env:
          UV_OFFLINE: "true"

  quality-gate:
    name: Quality gate
    if: always()
    needs: [script-checks, repository-and-studio, web, web-browser, static-checks, macos-companion, packages, wheel-boundaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [[ "$result" == success ]] || exit 1
          done
