[project]
name = "tinkerfin-studio"
dynamic = ["version"]
description = "Server application for TinkerFin Studio."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "ag-ui-protocol==0.1.19",
    "anyio>=4,<5",
    "asyncmy==0.2.14",
    "deepagents==0.7.13",
    "fastapi>=0.141,<1",
    "httpx>=0.28,<1",
    "langchain==1.3.18",
    "langchain-core==1.6.1",
    "langchain-deepseek==1.1.0",
    "langchain-openai==1.4.3",
    "langgraph==1.2.11",
    "langgraph-checkpoint-redis==0.5.1",
    "opensandbox==0.1.16",
    "pydantic>=2,<3",
    "pydantic-settings>=2.12,<3",
    "python-dotenv>=1.2,<2",
    "pyyaml>=6.0.3,<7",
    "redis>=6,<9",
    "sqlalchemy[asyncio]==2.0.52",
    "starlette>=1.3.1,<2",
    "tavily-python>=0.7,<1",
    "tinkerfin[agui,redis,tracing]==0.1.0",
    "tinkerfin-contracts==0.1.0",
    "tinkerfin-automation[sqlalchemy]==0.1.0",
    "tinkerfin-langgraph-store[sqlalchemy]==0.1.0",
    "tinkerfin-messaging[agui,redis]==0.1.0",
    "tinkerfin-sandbox[sqlalchemy]==0.1.0",
    "tinkerfin-tracing[sqlalchemy]==0.1.0",
    "uvicorn[standard]>=0.52,<1",
    "pillow>=12,<13",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "openpyxl>=3.1.5,<4",
    "reportlab>=4.4,<5",
    "concurrent-log-handler==0.9.29",
]

[project.scripts]
tinkerfin-studio = "tinkerfin_studio.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "tinkerfin_studio.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tinkerfin_studio = ["agent/*.yaml"]
