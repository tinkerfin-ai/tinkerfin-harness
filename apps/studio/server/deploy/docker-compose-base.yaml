name: tinkerfin-studio

services:
  mysql:
    profiles: [bundled, mysql]
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tinkerfin}
      MYSQL_USER: ${MYSQL_USER:-studio}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets: [mysql_password, mysql_root_password]
    ports:
      - "127.0.0.1:${MYSQL_PUBLISHED_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../database/mysql/schema.sql:/docker-entrypoint-initdb.d/10-studio-business.sql:ro
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h 127.0.0.1 -uroot -p$$(cat /run/secrets/mysql_root_password) --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  redis-runtime:
    profiles: [bundled, redis-runtime]
    image: redis/redis-stack-server:7.4.0-v8@sha256:798ab84d9f266936b034ab11c4d04a2b8e4b441884c5aa7d17ac951eefdf742a
    entrypoint: [/bin/sh, -ec]
    command: ['export REDIS_ARGS="--appendonly yes --requirepass $$(cat /run/secrets/redis_runtime_password)"; exec /entrypoint.sh']
    secrets: [redis_runtime_password]
    ports:
      - "127.0.0.1:${REDIS_RUNTIME_PUBLISHED_PORT:-6379}:6379"
    volumes:
      - redis-runtime-data:/data
    healthcheck:
      test: [CMD-SHELL, "redis-cli -a $$(cat /run/secrets/redis_runtime_password) ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  opensandbox:
    cpus: 0.5
    mem_limit: 512m
    profiles: [bundled, opensandbox]
    image: opensandbox/server:v0.2.3@sha256:ae8dfbb277f40a39ff01ef35e5e1c10675acfe0fa9db15259b8f323e5efab778
    entrypoint: [/bin/sh, -ec]
    command:
      - export OPENSANDBOX_SERVER_API_KEY="$$(cat /run/secrets/opensandbox_api_key)"; exec opensandbox-server --config /etc/opensandbox/config.toml
    extra_hosts:
      - host.docker.internal:host-gateway
    secrets: [opensandbox_api_key]
    ports:
      - "127.0.0.1:${OPEN_SANDBOX_PUBLISHED_PORT:-8091}:8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - opensandbox-data:/data
      - opensandbox-metadata:/root/.opensandbox/metadata
      - ./opensandbox/config.toml:/etc/opensandbox/config.toml:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped


secrets:
  mysql_root_password:
    file: ${SECRETS_DIR:-./secrets}/mysql_root_password
  mysql_password:
    file: ${SECRETS_DIR:-./secrets}/mysql_password
  redis_runtime_password:
    file: ${SECRETS_DIR:-./secrets}/redis_runtime_password
  opensandbox_api_key:
    file: ${SECRETS_DIR:-./secrets}/opensandbox_api_key
  database_url:
    file: ${SECRETS_DIR:-./secrets}/database_url

volumes:
  mysql-data:
  redis-runtime-data:
  opensandbox-data:
  opensandbox-metadata:
