name: tinkerfin

include:
  - docker-compose-base.yaml

services:
  server:
    image: ${STUDIO_IMAGE:-ghcr.io/tinkerfin-ai/studio-server:0.1.0}
    build:
      context: ../../../..
      dockerfile: apps/studio/server/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    logging:
      driver: local
      options:
        max-size: "50m"
        max-file: "3"
    env_file: ${STUDIO_ENV_FILE:-../../.env}
    environment:
      # 容器通过内部网络访问依赖，本机读取同一文件时使用发布端口
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_BUSINESS_DATABASE: ${MYSQL_BUSINESS_DATABASE:-tinkerfin}
      MYSQL_COMPONENTS_DATABASE: ${MYSQL_COMPONENTS_DATABASE:-tinkerfin_components}
      MYSQL_BUSINESS_USER: ${MYSQL_BUSINESS_USER:-tinkerfin}
      MYSQL_COMPONENTS_USER: ${MYSQL_COMPONENTS_USER:-tinkerfin_components}
      MYSQL_BUSINESS_PASSWORD: ${MYSQL_BUSINESS_PASSWORD:-}
      MYSQL_COMPONENTS_PASSWORD: ${MYSQL_COMPONENTS_PASSWORD:-}
      REDIS_RUNTIME_HOST: ${REDIS_RUNTIME_HOST:-redis-runtime}
      REDIS_RUNTIME_PORT: ${REDIS_RUNTIME_PORT:-6379}
      REDIS_RUNTIME_PASSWORD: ${REDIS_RUNTIME_PASSWORD:-}
      OPEN_SANDBOX_DOMAIN: ${OPEN_SANDBOX_DOMAIN:-opensandbox:8090}
      OPEN_SANDBOX_API_KEY: ${OPEN_SANDBOX_API_KEY:-}
      S3_STORAGE_ENDPOINT: ${S3_STORAGE_ENDPOINT:-http://minio:9000}
      S3_STORAGE_ACCESS_KEY: ${S3_STORAGE_ACCESS_KEY:-}
      S3_STORAGE_SECRET_KEY: ${S3_STORAGE_SECRET_KEY:-}
      # 应用只使用业务与组件账号，不接收数据库管理员凭据
      MYSQL_ROOT_PASSWORD: ''
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${STUDIO_BIND_ADDRESS:-127.0.0.1}:${STUDIO_PORT:-8090}:8090"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
        required: false
      mysql:
        condition: service_healthy
        required: false
      redis-runtime:
        condition: service_healthy
        required: false
      opensandbox:
        condition: service_healthy
        required: false
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 30s
