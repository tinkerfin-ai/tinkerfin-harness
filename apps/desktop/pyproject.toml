[project]
name = "tinkerfin-desktop"
version = "0.1.6"
description = "TinkerFin Studio macOS tool execution companion."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "aiosqlite==0.22.1",
    "httpx==0.28.1",
    "langchain-core==1.6.4",
    "pydantic>=2,<3",
    "sqlalchemy[asyncio]==2.0.52",
    "tinkerfin-contracts==0.1.1",
    "tinkerfin-sandbox[mcp]==0.1.1",
    "tinkerfin-remote==0.1.1",
    "websockets==15.0.1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tinkerfin_desktop = ["py.typed", "browser_help.md", "browser_release.json"]
